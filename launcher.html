<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>ScreenInk</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
    font-family: "Yu Gothic UI", "Meiryo UI", "Segoe UI", sans-serif; }
  #pill { position: absolute; inset: 4px; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 4px; background: rgba(24, 24, 27, 0.94); color: #f4f4f5; border-radius: 16px; }
  #grip { width: 100%; height: 22px; -webkit-app-region: drag; display: grid; place-items: center;
    color: rgba(255, 255, 255, 0.4); font-size: 12px; letter-spacing: 2px; }
  button { appearance: none; border: 0; background: transparent; color: inherit; font: inherit;
    font-size: 11px; line-height: 1.25; width: 48px; height: 48px; padding: 0; border-radius: 10px; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, 0.12); }
  button.accent { background: #ff453a; color: #fff; }
  body[data-state="idle"] .pass-only { display: none; }
  body[data-state="pass"] .idle-only { display: none; }
</style>
</head>
<body data-state="idle">
  <div id="pill">
    <div id="grip">•••</div>
    <button id="freeze" class="idle-only accent" title="今の画面を止めて書く">静止<br>で書く</button>
    <button id="live" class="idle-only" title="動いている画面に重ねて書く">重ねて<br>書く</button>
    <button id="folder" class="idle-only" title="保存フォルダを開く">保存先</button>
    <button id="quit" class="idle-only" title="アプリを終了">終了</button>
    <button id="back" class="pass-only accent" title="書き込みに戻る">書く</button>
    <button id="snap" class="pass-only" title="今の画面を止めて書く">静止</button>
    <button id="close" class="pass-only" title="書き込みを消して閉じる">閉じる</button>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
