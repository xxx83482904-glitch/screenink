<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>ScreenInk</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
    font-family: "Yu Gothic UI", "Meiryo UI", "Segoe UI", sans-serif; }
  #pill { position: absolute; inset: 4px; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 4px; background: rgba(24, 24, 27, 0.94); color: #f4f4f5; border-radius: 16px; }
  #grip { width: 100%; height: 22px; -webkit-app-region: drag; display: grid; place-items: center;
    color: rgba(255, 255, 255, 0.4); font-size: 12px; letter-spacing: 2px; }
  button { appearance: none; border: 0; background: transparent; color: inherit; font: inherit;
    width: 48px; height: 48px; padding: 0; border-radius: 10px; cursor: pointer; place-items: center; }
  button svg { display: block; pointer-events: none; }
  button:hover { background: rgba(255, 255, 255, 0.12); }
  button.accent { background: #ff453a; color: #fff; }
  /* 新しいバージョンがあるときは、つまみに印を付ける（確認はトレイのメニューから） */
  #grip { position: relative; }
  body[data-update="1"] #grip::after { content: ""; position: absolute; top: 3px; right: 4px; width: 7px; height: 7px;
    border-radius: 50%; background: #ff453a; }
  .idle-only, .pass-only, .add-only { display: none; }
  body[data-state="idle"] .idle-only, body[data-state="pass"] .pass-only, body[data-state="add"] .add-only { display: grid; }
</style>
</head>
<body data-state="idle">
  <div id="pill">
    <div id="grip">•••</div>
    <button id="freeze" class="idle-only accent" title="今の画面を止めて書く" aria-label="今の画面を止めて書く"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M10 8.5v4M14 8.5v4"/></svg></button>
    <button id="live" class="idle-only" title="動いている画面に重ねて書く" aria-label="動いている画面に重ねて書く"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8"/><path d="M8 13.5l.6-2.2 5.6-5.6a1.1 1.1 0 0 1 1.6 1.6l-5.6 5.6-2.2.6z" stroke-width="1.5"/></svg></button>
    <button id="back" class="pass-only accent" title="書き込みに戻る" aria-label="書き込みに戻る"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8"/><path d="M8 13.5l.6-2.2 5.6-5.6a1.1 1.1 0 0 1 1.6 1.6l-5.6 5.6-2.2.6z" stroke-width="1.5"/></svg></button>
    <button id="snap" class="pass-only" title="今の画面を止めて書く" aria-label="今の画面を止めて書く"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M10 8.5v4M14 8.5v4"/></svg></button>
    <button id="close" class="pass-only" title="書き込みを消して閉じる" aria-label="書き込みを消して閉じる"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="shoot" class="add-only accent" title="この画面を撮ってキャンバスに並べる (Ctrl+Alt+S)" aria-label="この画面を撮る"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a1 1 0 0 1 1-1h3M17 4h3a1 1 0 0 1 1 1v3M21 16v3a1 1 0 0 1-1 1h-3M7 20H4a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></button>
    <button id="cancel" class="add-only" title="撮らずに書き込みへ戻る" aria-label="撮らずに書き込みへ戻る"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7l-5 5 5 5"/><path d="M4 12h10a6 6 0 0 1 6 6"/></svg></button>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
